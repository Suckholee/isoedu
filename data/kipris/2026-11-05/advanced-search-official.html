<script type="text/javascript">

function excelDown(colTall, gridNo, sheetNm, fileName){

	var conf = confirm("API 입출력값을 EXCEL 파일로 생성하시겠습니까?\n");
	if(!conf) return ;
	
    var wb = XLSX.utils.book_new();
    var ws = XLSX.utils.table_to_sheet(document.getElementById('divExcel'));
    
    ws["!cols"] = [ {wch: 10}, {wch: 10}, {wch: 10}, {wch: 40}, {wch: 40}, {wch: 100} ];
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
    
    return XLSX.writeFile( wb, fileName + '.xlsx' );
}

function csvDown(colTall, gridNo, sheetNm, fileName){

	var conf = confirm("API 입출력값을 CSV 파일로 생성하시겠습니까?\n");
	if(!conf) return ;
	
    var wb = XLSX.utils.book_new();
    var ws = XLSX.utils.table_to_sheet(document.getElementById('divExcel'));
    var csv = XLSX.utils.sheet_to_csv(ws, {strip: true});
    	
//     console.log(csv);
    
    return downloadFile(csv, fileName + '.csv', 'text/csv;charset:utf-8');
}

function jsonDown(colTall, gridNo, sheetNm, fileName){

	var conf = confirm("API 입출력값을 JSON 파일로 생성하시겠습니까?\n");
	if(!conf) return ;
	
    var wb = XLSX.utils.book_new();
    var ws = XLSX.utils.table_to_sheet(document.getElementById('divExcel'));
    var json = XLSX.utils.sheet_to_json(ws, {header: 1, raw: false});
    	
//     console.log(json);
    
//     console.log(JSON.stringify(json));
    
    return downloadFile(JSON.stringify(json), fileName + '.json', 'application/json;charset:utf-8');
}

function downloadFile(data, fileName, mimeType){
	var a = document.createElement('a');
	mimeType = mimeType || 'application/octet-stream';
	
	if(navigator.msSaveBlob){
		navigator.msSaveBlob(new Blob(["\ufeff"+data], {
			type: mimeType
		}), fileName);
	} else if (URL&&'download' in a) {
		a.href = URL.createObjectURL(new Blob(["\ufeff"+data], {
			type: mimeType
		}));
		a.setAttribute('download', fileName);
		document.body.appendChild(a);
		a.click();
		document.body.removeChild(a);
	} else {
		location.href = 'data:application/octet-stream, '+encodeURIComponent("\ufeff"+data);
	}
}


function serviceOpen(){
	$("#service_open").hide();
	$("#service_close").show();
	$("#apiDescription1").slideDown();
		
// 	console.log("serviceOpen");
}

function serviceClose(){
	$("#service_open").show();
	$("#service_close").hide();
	$("#apiDescription1").slideUp();
		
// 	console.log("serviceClose");
		
}


</script>
